<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recycler Application - DropMyElectronic</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    :root{--primary-color:#2e7d32;--primary-light:#4caf50;--primary-dark:#1b5e20;--text-color:#333;--light-bg:#f5f5f5;--white:#fff;--card-bg:#fff;--shadow:0 4px 6px #0000001a;--hero-gradient:linear-gradient(135deg,var(--primary-light),var(--primary-color))}
    .dark-mode{--primary-color:#4caf50;--primary-light:#66bb6a;--primary-dark:#388e3c;--text-color:#e0e0e0;--light-bg:#121212;--white:#1e1e1e;--card-bg:#2d2d2d;--shadow:0 4px 6px #0000004d;--hero-gradient:linear-gradient(135deg,#1b5e20,#2e7d32)}
    *{margin:0;padding:0;box-sizing:border-box;transition:background-color .3s,color .3s}
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--light-bg);color:var(--text-color);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .dark-mode-toggle{position:fixed;top:20px;right:20px;z-index:1000;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.05);backdrop-filter:blur(10px);padding:8px 15px;border-radius:30px;box-shadow:var(--shadow)}
    .dark-mode-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;color:var(--text-color)}
    .dark-mode-switch{position:relative;width:50px;height:24px;background:#ccc;border-radius:34px;transition:background .3s}
    .dark-mode-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s}
    #dark-mode-checkbox:checked+.dark-mode-switch{background:var(--primary-color)}
    #dark-mode-checkbox:checked+.dark-mode-switch::after{transform:translateX(26px)}
    #dark-mode-checkbox{display:none}
    .card{background:var(--card-bg);border-radius:20px;box-shadow:var(--shadow);max-width:480px;width:100%;padding:40px;text-align:center}
    .icon{font-size:3.5rem;color:var(--primary-color);margin-bottom:20px}
    h1{font-size:1.5rem;margin-bottom:15px}
    p{margin-bottom:20px;line-height:1.6}
    .btn{display:inline-block;background:var(--primary-color);color:#fff;padding:10px 24px;border-radius:8px;font-weight:600;border:none;cursor:pointer;text-decoration:none}
    .status-rejected{color:#991b1b}
  </style>
</head>
<body>
  <div class="dark-mode-toggle">
    <label for="dark-mode-checkbox" class="dark-mode-label">
      <i class="fas fa-moon"></i><span>Dark Mode</span>
      <input type="checkbox" id="dark-mode-checkbox">
      <div class="dark-mode-switch"></div>
    </label>
  </div>
  <div class="card">
    <div id="content">
      <div class="icon"><i class="fas fa-hourglass-half"></i></div>
      <h1>Loading your status…</h1>
    </div>
  </div>

  <script>
    const darkModeToggle = document.getElementById('dark-mode-checkbox');
    const body = document.body;
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    const currentTheme = localStorage.getItem('theme');
    function updateDarkModeIcon(isDark) {
      const icon = document.querySelector('.dark-mode-label i');
      const label = document.querySelector('.dark-mode-label span');
      icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
      label.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
      body.classList.add('dark-mode'); darkModeToggle.checked = true; updateDarkModeIcon(true);
    }
    darkModeToggle.addEventListener('change', function() {
      body.classList.toggle('dark-mode', this.checked);
      localStorage.setItem('theme', this.checked ? 'dark' : 'light');
      updateDarkModeIcon(this.checked);
    });

    (async () => {
      const profile = await getProfile();
      const content = document.getElementById('content');

      if (!profile) {
        window.location.href = 'sign.html';
        return;
      }
      if (profile.role !== 'recycler') {
        window.location.href = 'index.html';
        return;
      }
      if (profile.recycler_status === 'approved') {
        window.location.href = 'recycler.html';
        return;
      }
      if (profile.recycler_status === 'rejected') {
        content.innerHTML = `
          <div class="icon status-rejected"><i class="fas fa-times-circle"></i></div>
          <h1 class="status-rejected">Application not approved</h1>
          <p>Your recycler application wasn't approved. If you think this is a mistake, please contact us so we can look into it.</p>
          <a href="support.html" class="btn">Contact Support</a>
        `;
        return;
      }
      // pending
      content.innerHTML = `
        <div class="icon"><i class="fas fa-hourglass-half"></i></div>
        <h1>Application under review</h1>
        <p>Thanks for signing up as a recycler! Our team is reviewing your application. You'll get access to the recycler dashboard as soon as you're approved.</p>
        <a href="index.html" class="btn">Back to Home</a>
      `;
    })();
  </script>
</body>
</html>
