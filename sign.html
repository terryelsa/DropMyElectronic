<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - DropMyElectronic</title>
    <meta name="description" content="Sign in or create an account with DropMyElectronic.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;

            --text-color: #333333;
            --muted-text: #666666;

            --page-bg: #f2f2f2;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --border-color: #e1e5e8;

            --error: #d32f2f;
            --success: #2e7d32;

            --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .dark-mode {
            --text-color: #eeeeee;
            --muted-text: #bbbbbb;

            --page-bg: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #292929;
            --border-color: #444444;

            --error: #ff6b6b;
            --success: #66bb6a;

            --shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
            color: var(--text-color);
        }

        /* Dark mode toggle */

        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            display: flex;
            align-items: center;
            gap: 10px;

            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 30px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .dark-mode-label {
            display: flex;
            align-items: center;
            gap: 8px;

            cursor: pointer;
            font-weight: 500;
            color: var(--text-color);
        }

        .dark-mode-switch {
            position: relative;
            width: 50px;
            height: 24px;

            background-color: #cccccc;
            border-radius: 34px;
        }

        .dark-mode-switch::after {
            content: '';

            position: absolute;
            top: 2px;
            left: 2px;

            width: 20px;
            height: 20px;

            background-color: white;
            border-radius: 50%;

            transition: transform 0.3s ease;
        }

        #dark-mode-checkbox {
            display: none;
        }

        #dark-mode-checkbox:checked + .dark-mode-switch {
            background-color: var(--primary-color);
        }

        #dark-mode-checkbox:checked + .dark-mode-switch::after {
            transform: translateX(26px);
        }

        /* Main card */

        .auth-container {
            background: var(--card-bg);
            border-radius: 18px;

            box-shadow: var(--shadow);

            max-width: 450px;
            width: 100%;

            overflow: hidden;
        }

        /* Header */

        .auth-header {
            background: var(--card-bg);
            color: var(--text-color);

            padding: 35px 30px 25px;

            text-align: center;

            border-bottom: 1px solid var(--border-color);
        }

        .auth-logo {
            width: 70px;
            height: 70px;

            background: #e8f5e9;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            font-size: 32px;
            color: var(--primary-color);
        }

        .auth-header h1 {
            font-size: 1.8rem;
            margin-bottom: 7px;
            color: var(--text-color);
        }

        .auth-header p {
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        /* Tabs */

        .auth-tabs {
            display: flex;
            background: var(--card-bg);

            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;

            padding: 15px;

            background: none;
            border: none;

            font-size: 1rem;
            font-weight: 600;

            color: var(--muted-text);

            cursor: pointer;

            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* Body */

        .auth-body {
            padding: 30px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--text-color);

            font-weight: 600;
            font-size: 0.95rem;
        }

        .optional {
            color: var(--muted-text);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted-text);

            opacity: 0.8;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 13px 15px 13px 45px;

            border: 1px solid var(--border-color);
            border-radius: 9px;

            font-size: 1rem;

            background: var(--input-bg);
            color: var(--text-color);

            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;

            border-color: var(--primary-color);

            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.08);
        }

        .form-group input.error {
            border-color: var(--error);
        }

        .form-group input.success {
            border-color: var(--success);
        }

        .error-message {
            color: var(--error);

            font-size: 0.85rem;

            margin-top: 5px;

            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Password */

        .password-toggle {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            background: none;
            border: none;

            color: var(--muted-text);

            cursor: pointer;

            font-size: 1rem;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        /* Remember / forgot */

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;

            font-size: 0.9rem;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 6px;

            color: var(--text-color);
        }

        .remember-forgot a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        /* Submit button */

        .submit-btn {
            width: 100%;

            padding: 14px;

            background: var(--primary-color);
            color: white;

            border: none;
            border-radius: 9px;

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);

            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Password strength */

        .strength-meter {
            height: 5px;

            background: var(--border-color);

            border-radius: 5px;

            margin-top: 8px;

            overflow: hidden;
        }

        .strength-meter-fill {
            height: 100%;
            width: 0;

            transition: all 0.3s ease;
        }

        .strength-weak {
            background: var(--error);
            width: 33%;
        }

        .strength-medium {
            background: #ff9800;
            width: 66%;
        }

        .strength-strong {
            background: var(--success);
            width: 100%;
        }

        /* Back link */

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: var(--primary-color);

            text-decoration: none;

            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .auth-container {
                max-width: 100%;
            }

            .auth-header {
                padding: 30px 20px 20px;
            }

            .auth-body {
                padding: 25px 20px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .dark-mode-toggle {
                top: 12px;
                right: 12px;
            }

            .dark-mode-label span {
                display: none;
            }
        }
    </style>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments); };</script>

    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-client.js"></script>
</head>

<body>

    <!-- Dark mode -->
    <div class="dark-mode-toggle">
        <label for="dark-mode-checkbox" class="dark-mode-label">
            <i class="fas fa-moon"></i>

            <span>Dark Mode</span>

            <input type="checkbox" id="dark-mode-checkbox">

            <div class="dark-mode-switch"></div>
        </label>
    </div>

    <div class="auth-container">

        <!-- Header -->
        <div class="auth-header">

            <div class="auth-logo">
                <i class="fas fa-recycle"></i>
            </div>

            <h1>DropMyElectronic</h1>

            <p>Eco-friendly e-waste solutions</p>

        </div>

        <!-- Tabs -->
        <div class="auth-tabs">

            <button class="tab-btn active" onclick="switchTab('signin')">

                Sign In

            </button>

            <button class="tab-btn" onclick="switchTab('signup')">

                Sign Up

            </button>

        </div>

        <div class="auth-body">

            <!-- ========================= -->
            <!-- SIGN IN -->
            <!-- ========================= -->

            <form id="signinForm" class="form-container active" onsubmit="handleSignIn(event)">

                <div class="form-group">

                    <label for="signin-email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-envelope"></i>

                        <input type="email" id="signin-email" name="email" placeholder="your.email@example.com" required>

                    </div>

                    <span class="error-message" id="signin-email-error">
                    </span>

                </div>

                <div class="form-group">

                    <label for="signin-password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input type="password" id="signin-password" name="password" placeholder="Enter your password" required>

                        <button type="button" class="password-toggle" onclick="togglePassword('signin-password')">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                    <span class="error-message" id="signin-password-error">
                    </span>

                </div>

                <div class="remember-forgot">

                    <label>
                        <input type="checkbox" name="remember">

                        Remember me
                    </label>

                    <a href="#" onclick="alert('Password reset link will be sent to your email')">

                        Forgot Password?

                    </a>

                </div>

                <button type="submit" class="submit-btn" id="signinSubmitBtn">

                    Sign In

                </button>

            </form>

            <!-- ========================= -->
            <!-- SIGN UP -->
            <!-- ========================= -->

            <form id="signupForm" class="form-container" onsubmit="handleSignUp(event)">

                <!-- Full name -->

                <div class="form-group">

                    <label for="signup-name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-user"></i>

                        <input type="text" id="signup-name" name="name" placeholder="John Doe" required>

                    </div>

                    <span class="error-message" id="signup-name-error">
                    </span>

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="signup-email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-envelope"></i>

                        <input type="email" id="signup-email" name="email" placeholder="your.email@example.com" required>

                    </div>

                    <span class="error-message" id="signup-email-error">
                    </span>

                </div>

                <!-- Phone - OPTIONAL -->

                <div class="form-group">

                    <label for="signup-phone">
                        Phone Number
                        <span class="optional">(Optional)</span>
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-phone"></i>

                        <input type="tel" id="signup-phone" name="phone" placeholder="+254 700 000000">

                    </div>

                    <span class="error-message" id="signup-phone-error">
                    </span>

                </div>

                <!-- Password -->

                <div class="form-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input type="password" id="signup-password" name="password" placeholder="Create a strong password" required>

                        <button type="button" class="password-toggle" onclick="togglePassword('signup-password')">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                    <div class="strength-meter">

                        <div class="strength-meter-fill" id="strength-fill">
                        </div>

                    </div>

                    <span class="error-message" id="signup-password-error">
                    </span>

                </div>

                <!-- Confirm password -->

                <div class="form-group">

                    <label for="signup-confirm">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-lock"></i>

                        <input type="password" id="signup-confirm" name="confirm" placeholder="Re-enter your password" required>

                        <button type="button" class="password-toggle" onclick="togglePassword('signup-confirm')">

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                    <span class="error-message" id="signup-confirm-error">
                    </span>

                </div>

                <!-- Role -->

                <div class="form-group">

                    <label for="signup-role">
                        I'm signing up as
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-user-tag"></i>

                        <select id="signup-role" name="role">

                            <option value="user">
                                Household / Donor — I want to request pickups & earn points
                            </option>

                            <option value="recycler">
                                Recycler — I verify pickups & manage a drop-off point
                            </option>

                        </select>

                    </div>

                </div>

                <!-- Create account -->

                <button type="submit" class="submit-btn" id="signupSubmitBtn">

                    Create Account

                </button>

            </form>

            <!-- Back home -->

            <div class="back-link">

                <a href="index.html">

                    <i class="fas fa-arrow-left"></i>
                    Back to Home

                </a>

            </div>

        </div>

    </div>

    <script>

        /* ================================
           TAB SWITCHING
        ================================= */

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(button =>
                    button.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(form =>
                    form.classList.remove('active'));
            if (tab === 'signin') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('signinForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active'); }
        }

        /* ================================
           PASSWORD VISIBILITY
        ================================= */

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        /* ================================
           VALIDATION
        ================================= */

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        function validatePhone(phone) {
            return /^(\+254|0)[17]\d{8}$/.test(phone.replace(/\s/g, ''));
        }
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[$@#&!]/.test(password)) strength++;
            return strength;
        }

        /* ================================
           PASSWORD STRENGTH
        ================================= */

        document.getElementById('signup-password')
            ?.addEventListener('input', (e) => {
                const strengthFill = document.getElementById('strength-fill');
                const strength = checkPasswordStrength(e.target.value);
                strengthFill.className = 'strength-meter-fill';
                if (strength <= 2) {
                    strengthFill.classList.add('strength-weak');
                } else if (strength <= 4) {
                    strengthFill.classList.add('strength-medium');
                } else {
                    strengthFill.classList.add('strength-strong'); } });

        /* ================================
           ERROR HANDLING
        ================================= */

        function showError(inputId, message) {
            const input = document.getElementById(inputId);
            const error = document.getElementById(`${inputId}-error`);
            input.classList.add('error');
            input.classList.remove('success');
            error.textContent = message;
            error.classList.add('show');
        }
        function showSuccess(inputId) {
            const input = document.getElementById(inputId);
            const error = document.getElementById(`${inputId}-error`);
            input.classList.add('success');
            input.classList.remove('error');
            error.classList.remove('show');
        }

        /* ================================
           REDIRECT
        ================================= */

        const nextParam = new URLSearchParams(window.location.search).get('next');
        function redirectAfterAuth(role, recyclerStatus) {
            if (role === 'recycler' && recyclerStatus !== 'approved') {
                window.location.href = 'recycler-pending.html';
                return;
            }
            if (nextParam) {
                window.location.href = nextParam;
                return;
            }
            window.location.href = role === 'recycler'
                    ? 'recycler.html'
                    : 'reward.html';
        }

        /* ================================
           SIGN IN
        ================================= */

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signin-email').value.trim();
            const password = document.getElementById('signin-password').value;
            let isValid = true;
            if (!validateEmail(email)) {
                showError('signin-email', 'Please enter a valid email address');
                isValid = false;
            } else {
                showSuccess('signin-email');
            }
            if (password.length < 6) {
                showError('signin-password', 'Password must be at least 6 characters');
                isValid = false;
            } else {
                showSuccess('signin-password');
            }
            if (!isValid) return;
            const btn = document.getElementById('signinSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            const {
                data, error
            } = await sb.auth.signInWithPassword({email, password });
            if (error) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                showError('signin-password', error.message);
                return;
            }
            const profile = await getProfile();
            redirectAfterAuth(profile ? profile.role : 'user', profile
                    ? profile.recycler_status
                    : 'none');
        }

        /* ================================
           SIGN UP
        ================================= */

        async function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const role = document.getElementById('signup-role').value;
            let isValid = true;

            /* Full name */

            if (name.length < 2) {
                showError('signup-name', 'Please enter your full name');
                isValid = false;
            } else {
                showSuccess('signup-name');
            }

            /* Email */

            if (!validateEmail(email)) {
                showError('signup-email', 'Please enter a valid email address');
                isValid = false;
            } else {
                showSuccess('signup-email');
            }

            /* Phone is OPTIONAL */

            if (phone !== '') {
                if (!validatePhone(phone)) {
                    showError('signup-phone', 'Please enter a valid Kenyan phone number');
                    isValid = false;
                } else {
                    showSuccess('signup-phone'); }
            } else {
                const phoneInput = document.getElementById('signup-phone');
                phoneInput.classList.remove('error', 'success');
                document.getElementById('signup-phone-error').classList.remove('show');
            }

            /* Password */

            if (checkPasswordStrength(password) < 3) {
                showError('signup-password', 'Password is too weak. Use uppercase, lowercase, numbers, and symbols.');
                isValid = false;
            } else {
                showSuccess('signup-password');
            }

            /* Confirm password */

            if (password !== confirm) {
                showError('signup-confirm', 'Passwords do not match');
                isValid = false;
            } else {
                showSuccess('signup-confirm');
            }
            if (!isValid) return;
            const btn = document.getElementById('signupSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            /*
             * Phone is allowed to be empty.
             * Empty phone is stored as null in metadata.
             */

            const { data, error } = await sb.auth.signUp({
                email, password,
                options: { data: { full_name: name, phone: phone || null, role: role } }
            });
            if (error) {
                btn.disabled = false;
                btn.textContent = 'Create Account';
                showError('signup-email', error.message);
                return;
            }

            /*
             * Email confirmation enabled
             */

            if (!data.session) {
                alert('Account created! Please check your email to confirm your address, then sign in.');
                btn.disabled = false;
                btn.textContent = 'Create Account';
                switchTab('signin');
                document.getElementById('signin-email').value = email;
                return;
            }
            redirectAfterAuth(role, role === 'recycler'
                    ? 'pending'
                    : 'none');
        }

        /* ================================
           DARK MODE
        ================================= */

        const darkModeToggle = document.getElementById('dark-mode-checkbox');
        const body = document.body;
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
        const currentTheme = localStorage.getItem('theme');
        function updateDarkModeIcon(isDark) {
            const icon = document.querySelector('.dark-mode-label i');
            const label = document.querySelector('.dark-mode-label span');
            icon.className = isDark
                    ? 'fas fa-sun'
                    : 'fas fa-moon';
            label.textContent = isDark
                    ? 'Light Mode'
                    : 'Dark Mode';
        }
        if (currentTheme === 'dark' || (!currentTheme && prefersDarkScheme.matches)) {
            body.classList.add('dark-mode');
            darkModeToggle.checked = true;
            updateDarkModeIcon(true);
        }
        darkModeToggle.addEventListener('change', function () {
                if (this.checked) {
                    body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                    updateDarkModeIcon(true);
                } else {
                    body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                    updateDarkModeIcon(false); } });
        prefersDarkScheme.addEventListener('change', function (e) {
                if (!localStorage.getItem('theme')) {
                    if (e.matches) {
                        body.classList.add('dark-mode');
                        darkModeToggle.checked = true;
                        updateDarkModeIcon(true);
                    } else {
                        body.classList.remove('dark-mode');
                        darkModeToggle.checked = false;
                        updateDarkModeIcon(false); } } });</script>
