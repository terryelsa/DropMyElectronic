<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - DropMyElectronic</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {

            --primary: #2e7d32;
            --primary-dark: #1b5e20;

            --text: #333;
            --muted: #6b7280;

            --page-bg: #eef1f3;
            --card-bg: #ffffff;

            --border: #e1e5e8;

            --success: #2e7d32;
            --error: #d32f2f;

            --shadow: 0 10px 35px rgba(0,0,0,0.08);
        }


        .dark-mode {

            --text: #eeeeee;
            --muted: #aaaaaa;

            --page-bg: #121212;
            --card-bg: #1e1e1e;

            --border: #444;

            --success: #66bb6a;
            --error: #ff6b6b;

            --shadow: 0 10px 35px rgba(0,0,0,0.5);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background: var(--page-bg);

            min-height: 100vh;

            color: var(--text);
        }


        /* NAVBAR */

        .navbar {

            height: 70px;

            background: var(--card-bg);

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            color: var(--primary);

            font-size: 1.2rem;

            font-weight: 700;
        }


        .logo i {
            font-size: 1.4rem;
        }


        .nav-actions {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .nav-link {

            color: var(--text);

            text-decoration: none;

            font-weight: 500;
        }


        .nav-link:hover {
            color: var(--primary);
        }


        .logout-btn {

            border: none;

            background: none;

            color: var(--error);

            cursor: pointer;

            font-size: 0.95rem;

            font-weight: 600;
        }


        /* PAGE */

        .page {

            max-width: 850px;

            margin: 50px auto;

            padding: 0 20px;
        }


        .page-header {

            margin-bottom: 25px;
        }


        .page-header h1 {

            font-size: 2rem;

            margin-bottom: 8px;
        }


        .page-header p {

            color: var(--muted);

            font-size: 0.95rem;
        }


        /* PROFILE CARD */

        .profile-card {

            background: var(--card-bg);

            border-radius: 16px;

            box-shadow: var(--shadow);

            padding: 35px;
        }


        .profile-top {

            display: flex;

            align-items: center;

            gap: 20px;

            padding-bottom: 25px;

            margin-bottom: 30px;

            border-bottom:
                1px solid var(--border);
        }


        .profile-avatar {

            width: 75px;

            height: 75px;

            border-radius: 50%;

            background: #e8f5e9;

            color: var(--primary);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;
        }


        .profile-top h2 {

            font-size: 1.4rem;

            margin-bottom: 5px;
        }


        .profile-top p {

            color: var(--muted);

            font-size: 0.9rem;
        }


        /* FORM */

        .form-group {

            margin-bottom: 22px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-wrapper i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--muted);
        }


        .form-group input {

            width: 100%;

            padding:
                13px
                15px
                13px
                45px;

            border:
                1px solid var(--border);

            border-radius: 9px;

            background: var(--card-bg);

            color: var(--text);

            font-size: 1rem;
        }


        .form-group input:focus {

            outline: none;

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(46,125,50,0.08);
        }


        .form-group input:disabled {

            background:
                var(--page-bg);

            cursor: not-allowed;
        }


        .help-text {

            margin-top: 6px;

            color: var(--muted);

            font-size: 0.82rem;
        }


        /* BUTTON */

        .save-btn {

            width: 100%;

            padding: 14px;

            background:
                var(--primary);

            color: white;

            border: none;

            border-radius: 9px;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;
        }


        .save-btn:hover {

            background:
                var(--primary-dark);
        }


        .save-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        /* MESSAGE */

        .message {

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

            font-size: 0.9rem;
        }


        .message.show {
            display: block;
        }


        .message.success {

            background: #e8f5e9;

            color: #2e7d32;
        }


        .message.error {

            background: #ffebee;

            color: #c62828;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }


            .nav-link {
                display: none;
            }


            .page {
                margin: 30px auto;
            }


            .profile-card {
                padding: 25px 20px;
            }


            .profile-top {
                align-items: flex-start;
            }
        }

    </style>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>

    <script src="js/supabase-client.js"></script>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <a
            href="index.html"
            class="logo">

            <i class="fas fa-recycle"></i>

            <span>DropMyElectronic</span>

        </a>


        <div class="nav-actions">

            <a
                href="index.html"
                class="nav-link">

                Home

            </a>


            <button
                class="logout-btn"
                onclick="logout()">

                <i class="fas fa-sign-out-alt"></i>

                Sign Out

            </button>

        </div>

    </nav>


    <!-- PAGE -->

    <main class="page">

        <div class="page-header">

            <h1>My Profile</h1>

            <p>
                Update your personal information.
            </p>

        </div>


        <div class="profile-card">

            <!-- PROFILE HEADER -->

            <div class="profile-top">

                <div class="profile-avatar">

                    <i class="fas fa-user"></i>

                </div>


                <div>

                    <h2 id="profile-name">
                        Loading...
                    </h2>

                    <p id="profile-email">
                        Loading...
                    </p>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- PROFILE FORM -->

            <form
                id="profileForm"
                onsubmit="updateProfile(event)">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="full-name">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="full-name"
                            placeholder="Your full name"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            disabled>

                    </div>

                    <p class="help-text">
                        Your email address cannot be changed here.
                    </p>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                        <span
                            style="
                            color:var(--muted);
                            font-weight:400;
                            font-size:0.85rem;
                            ">
                            (Optional)
                        </span>
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-phone"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="+254 700 000000">

                    </div>

                    <p class="help-text">
                        You can add your phone number later if you need pickup services.
                    </p>

                </div>


                <button
                    type="submit"
                    class="save-btn"
                    id="saveBtn">

                    Save Changes

                </button>

            </form>

        </div>

    </main>


    <script>

        let currentUser = null;


        /* ================================
           SHOW MESSAGE
        ================================= */

        function showMessage(message, type) {

            const box =
                document.getElementById(
                    'message'
                );


            box.textContent = message;

            box.className =
                `message show ${type}`;


            setTimeout(() => {

                box.classList.remove(
                    'show'
                );

            }, 5000);
        }


        /* ================================
           LOAD PROFILE
        ================================= */

        async function loadProfile() {

            try {

                const {
                    data,
                    error
                } = await sb.auth.getUser();


                if (error || !data.user) {

                    window.location.href =
                        'sign.html';

                    return;
                }


                currentUser = data.user;


                /* Email */

                document.getElementById(
                    'email'
                ).value =
                    currentUser.email || '';


                document.getElementById(
                    'profile-email'
                ).textContent =
                    currentUser.email || '';


                /*
                 * Get profile from your
                 * existing helper.
                 */

                const profile =
                    await getProfile();


                if (profile) {

                    document.getElementById(
                        'full-name'
                    ).value =
                        profile.full_name || '';


                    document.getElementById(
                        'phone'
                    ).value =
                        profile.phone || '';


                    document.getElementById(
                        'profile-name'
                    ).textContent =
                        profile.full_name ||
                        'My Profile';

                } else {

                    /*
                     * Fallback to Supabase
                     * authentication metadata.
                     */

                    const metadata =
                        currentUser.user_metadata || {};


                    document.getElementById(
                        'full-name'
                    ).value =
                        metadata.full_name || '';


                    document.getElementById(
                        'phone'
                    ).value =
                        metadata.phone || '';


                    document.getElementById(
                        'profile-name'
                    ).textContent =
                        metadata.full_name ||
                        'My Profile';
                }

            } catch (error) {

                console.error(
                    'Profile loading error:',
                    error
                );

                showMessage(
                    'Unable to load your profile.',
                    'error'
                );
            }
        }


        /* ================================
           VALIDATE PHONE
        ================================= */

        function validatePhone(phone) {

            return /^(\+254|0)[17]\d{8}$/
                .test(
                    phone.replace(/\s/g, '')
                );
        }


        /* ================================
           UPDATE PROFILE
        ================================= */

        async function updateProfile(e) {

            e.preventDefault();


            const fullName =
                document.getElementById(
                    'full-name'
                ).value.trim();


            const phone =
                document.getElementById(
                    'phone'
                ).value.trim();


            if (fullName.length < 2) {

                showMessage(
                    'Please enter your full name.',
                    'error'
                );

                return;
            }


            /*
             * Phone remains optional.
             */

            if (
                phone !== '' &&
                !validatePhone(phone)
            ) {

                showMessage(
                    'Please enter a valid Kenyan phone number.',
                    'error'
                );

                return;
            }


            const saveBtn =
                document.getElementById(
                    'saveBtn'
                );


            saveBtn.disabled = true;

            saveBtn.textContent =
                'Saving...';


            try {

                /*
                 * Update authentication
                 * metadata.
                 */

                const {
                    error: authError
                } =
                    await sb.auth.updateUser({

                        data: {

                            full_name: fullName,

                            phone: phone || null

                        }

                    });


                if (authError) {

                    throw authError;
                }


                /*
                 * Update the profiles table.
                 *
                 * This assumes your profiles
                 * table uses auth user's ID
                 * in the "id" column.
                 */

                const {
                    error: profileError
                } =
                    await sb
                        .from('profiles')
                        .update({

                            full_name: fullName,

                            phone: phone || null

                        })
                        .eq(
                            'id',
                            currentUser.id
                        );


                if (profileError) {

                    throw profileError;
                }


                document.getElementById(
                    'profile-name'
                ).textContent =
                    fullName;


                showMessage(
                    'Your profile has been updated successfully.',
                    'success'
                );


            } catch (error) {

                console.error(
                    'Profile update error:',
                    error
                );


                showMessage(
                    error.message ||
                    'Unable to update your profile.',
                    'error'
                );

            } finally {

                saveBtn.disabled = false;

                saveBtn.textContent =
                    'Save Changes';
            }
        }


        /* ================================
           LOGOUT
        ================================= */

        async function logout() {

            const {
                error
            } = await sb.auth.signOut();


            if (error) {

                alert(
                    'Unable to sign out. Please try again.'
                );

                return;
            }


            window.location.href =
                'sign.html';
        }


        /* ================================
           START
        ================================= */

        loadProfile();

    </script>

</body>
</html>
